name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Ne pas interrompre un transfert FTP en cours.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint, tests et build
    # Version figée pour éviter une migration automatique de l'environnement CI.
    runs-on: ubuntu-24.04
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Conserver le site généré
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Publication FTP
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Vérifier les paramètres de publication
        run: node scripts/validate-deploy.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ github.sha }}
          path: dist/
      - name: Envoyer les fichiers vérifiés
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          local-dir: dist/
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
